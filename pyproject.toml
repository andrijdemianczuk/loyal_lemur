[project]
name = "er-triage"
version = "0.1.0"
description = "AI decision support for emergency department intake and triage (synthetic data demo)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.3.0",
    "faker>=40.44.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
er-triage = "er_triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/er_triage"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
